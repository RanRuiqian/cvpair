name: 问题反馈 / Bug report
description: 某个功能不正常 / Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **请不要贴真实简历、联系方式或 API Key。** 需要示例时请用虚构内容。
        **Please don't paste your real resume, contact details or API key.** Use made-up examples.
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤 / Steps to reproduce
      placeholder: "1. 打开…  2. 点击…  3. 看到…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 vs 实际结果 / Expected vs. actual
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 错误信息 / Error details
      description: 如果出现了错误页，点「复制错误信息」粘贴到这里。 / If the error page appeared, paste the text from “Copy error details”.
      render: text
  - type: input
    id: browser
    attributes:
      label: 浏览器与系统 / Browser & OS
      placeholder: "Chrome 142 / Windows 11"
  - type: dropdown
    id: provider
    attributes:
      label: AI 服务商 / AI provider
      options: [DeepSeek, 通义千问 Qwen, OpenAI, 其他 Other, 演示模式 Demo mode]
