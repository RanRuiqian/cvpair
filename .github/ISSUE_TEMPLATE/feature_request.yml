name: 功能建议 / Feature request
description: 想要一个新功能或改进 / Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 遇到了什么麻烦？ / What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 希望怎么解决？ / What would you like to happen?
  - type: textarea
    id: notes
    attributes:
      label: 其他补充 / Anything else
